<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Happy Raksha Bandhan ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================================================= */
/* RESET */
/* ================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}


/* ================================================= */
/* MAIN CONTAINER */
/* ================================================= */

.container{

    display:flex;

    width:100%;

    height:100dvh;

    transition:transform 0.7s cubic-bezier(0.77,0,0.175,1);

    will-change:transform;
}


/* ================================================= */
/* SLIDES */
/* ================================================= */

.slide{

    flex:0 0 100vw;

    width:100vw;

    height:100dvh;

    min-height:100svh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:
        max(25px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(25px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

    color:white;

    position:relative;

    overflow:hidden;

}


/* ================================================= */
/* BACKGROUNDS */
/* ================================================= */

.slide:nth-child(1){
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
}

.slide:nth-child(2){
    background:linear-gradient(135deg,#ff512f,#dd2476);
}

.slide:nth-child(3){
    background:linear-gradient(135deg,#8e2de2,#4a00e0);
}

.slide:nth-child(4){
    background:#000;
}

.slide:nth-child(5){
    background:#000;
}

.slide:nth-child(6){
    background:#000;
}

.slide:nth-child(7){
    background:#000;
}

.slide:nth-child(8){
    background:linear-gradient(135deg,#141e30,#243b55);
}


/* ================================================= */
/* HEADINGS */
/* ================================================= */

h1{
    margin-bottom:20px;

    font-size:30px;

    line-height:1.3;
}

p{
    line-height:1.7;
}


/* ================================================= */
/* RAKHI ICON */
/* ================================================= */

.rakhi{

    font-size:65px;

    margin-bottom:15px;

    animation:float 2s ease-in-out infinite;

}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

}


/* ================================================= */
/* INPUT */
/* ================================================= */

input{

    padding:13px 20px;

    border:none;

    border-radius:30px;

    font-size:16px;

    text-align:center;

    margin-bottom:20px;

    width:75%;

    max-width:300px;

    outline:none;

    -webkit-appearance:none;

}

input:focus{

    box-shadow:0 0 0 3px rgba(255,255,255,0.3);

}


/* ================================================= */
/* BUTTON */
/* ================================================= */

button{

    margin-top:20px;

    padding:12px 28px;

    border:none;

    border-radius:30px;

    background:white;

    color:#e91e63;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:transform 0.25s ease;

    z-index:10;

    -webkit-tap-highlight-color:transparent;

}

button:hover{

    transform:scale(1.05);

}

button:active{

    transform:scale(0.96);

}


/* ================================================= */
/* MESSAGE SLIDE */
/* ================================================= */

.message-slide{

    justify-content:flex-start;

    padding-top:
        max(40px, env(safe-area-inset-top));

    padding-bottom:
        max(20px, env(safe-area-inset-bottom));

}


/* ================================================= */
/* MESSAGE BOX */
/* ================================================= */

.message{

    width:100%;

    max-width:650px;

    font-size:15px;

    line-height:1.85;

    max-height:62dvh;

    overflow-y:auto;

    padding:5px 12px;

    -webkit-overflow-scrolling:touch;

}


/* Hide scrollbar */

.message::-webkit-scrollbar{

    width:4px;

}

.message::-webkit-scrollbar-thumb{

    background:rgba(255,255,255,0.5);

    border-radius:10px;

}


/* ================================================= */
/* FULL SCREEN PHOTO SLIDE */
/* ================================================= */

.photo-slide{

    padding:0;

    width:100vw;

    height:100dvh;

    min-height:100svh;

    background:#000;

}


/* FULL SCREEN IMAGE */

.photo{

    position:absolute;

    inset:0;

    width:100vw;

    height:100dvh;

    min-height:100svh;

    object-fit:cover;

    object-position:center;

    display:block;

}


/* ================================================= */
/* PHOTO BUTTON */
/* ================================================= */

.photo-slide button{

    position:absolute;

    bottom:

        max(25px, env(safe-area-inset-bottom));

    left:50%;

    transform:translateX(-50%);

    margin:0;

    background:rgba(255,255,255,0.92);

    box-shadow:0 5px 20px rgba(0,0,0,0.4);

}

.photo-slide button:hover{

    transform:translateX(-50%) scale(1.05);

}

.photo-slide button:active{

    transform:translateX(-50%) scale(0.96);

}


/* ================================================= */
/* PHOTO DARK GRADIENT */
/* ================================================= */

.photo-slide::after{

    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:180px;

    background:linear-gradient(
        to top,
        rgba(0,0,0,0.65),
        transparent
    );

    pointer-events:none;

}


/* ================================================= */
/* FINAL SLIDE */
/* ================================================= */

.final-text{

    max-width:600px;

    font-size:17px;

    line-height:1.9;

}


/* ================================================= */
/* MOBILE */
/* ================================================= */

@media(max-width:600px){

    h1{

        font-size:24px;

        line-height:1.35;

    }

    .rakhi{

        font-size:55px;

    }

    input{

        width:85%;

        font-size:16px;

    }

    button{

        padding:11px 24px;

        font-size:15px;

    }

    .message-slide{

        padding-left:16px;

        padding-right:16px;

    }

    .message{

        width:100%;

        font-size:13.5px;

        line-height:1.75;

        max-height:64dvh;

    }

    .final-text{

        width:90%;

        font-size:15px;

    }

}


/* ================================================= */
/* VERY SMALL MOBILE */
/* ================================================= */

@media(max-width:380px){

    h1{

        font-size:21px;

    }

    .rakhi{

        font-size:48px;

    }

    .message{

        font-size:13px;

        line-height:1.7;

        max-height:65dvh;

    }

}


/* ================================================= */
/* LANDSCAPE MOBILE */
/* ================================================= */

@media(max-height:500px) and (orientation:landscape){

    h1{

        font-size:20px;

        margin-bottom:10px;

    }

    .rakhi{

        font-size:40px;

        margin-bottom:5px;

    }

    .message{

        max-height:55dvh;

        font-size:12px;

    }

    button{

        margin-top:10px;

        padding:8px 20px;

        font-size:13px;

    }

}

</style>

</head>


<body>


<div class="container" id="container">


<!-- ================================================= -->
<!-- SLIDE 1 : NAME -->
<!-- ================================================= -->

<div class="slide">

    <div class="rakhi">
        🪢
    </div>

    <h1>
        A Special Rakhi Surprise ❤️
    </h1>

    <p style="margin-bottom:20px;">
        Enter your name to open your surprise ✨
    </p>

    <input
        type="text"
        id="username"
        placeholder="Enter your name"
        autocomplete="off"
    >

    <button onclick="checkName()">
        Open My Surprise 💝
    </button>

</div>


<!-- ================================================= -->
<!-- SLIDE 2 : GREETING -->
<!-- ================================================= -->

<div class="slide">

    <div class="rakhi">
        🪢
    </div>

    <h1 id="greeting"></h1>

    <p>
        There is something I want to tell you ❤️
    </p>

    <button onclick="nextSlide()">
        Start ✨
    </button>

</div>


<!-- ================================================= -->
<!-- SLIDE 3 : MESSAGE -->
<!-- ================================================= -->

<div class="slide message-slide">

    <h1>
        Happy Raksha Bandhan 🪢❤️
    </h1>

    <div
        class="message"
        id="message"
    ></div>

    <button onclick="nextSlide()">
        Next ❤️
    </button>

</div>


<!-- ================================================= -->
<!-- SLIDE 4 : PHOTO 1 -->
<!-- ================================================= -->

<div class="slide photo-slide">

    <img
        id="photo1"
        class="photo"
        src=""
        alt="Memory"
    >

    <button onclick="nextSlide()">
        Next ✨
    </button>

</div>


<!-- ================================================= -->
<!-- SLIDE 5 : PHOTO 2 -->
<!-- ================================================= -->

<div class="slide photo-slide">

    <img
        id="photo2"
        class="photo"
        src=""
        alt="Memory"
    >

    <button onclick="nextSlide()">
        Next ❤️
    </button>

</div>


<!-- ================================================= -->
<!-- SLIDE 6 : PHOTO 3 -->
<!-- ================================================= -->

<div class="slide photo-slide">

    <img
        id="photo3"
        class="photo"
        src=""
        alt="Memory"
    >

    <button onclick="nextSlide()">
        Next 🥰
    </button>

</div>


<!-- ================================================= -->
<!-- SLIDE 7 : PHOTO 4 -->
<!-- ================================================= -->

<div class="slide photo-slide">

    <img
        id="photo4"
        class="photo"
        src=""
        alt="Memory"
    >

    <button onclick="nextSlide()">
        Next ❤️
    </button>

</div>


<!-- ================================================= -->
<!-- SLIDE 8 : FINAL -->
<!-- ================================================= -->

<div class="slide">

    <div class="rakhi">
        🪢
    </div>

    <h1 id="finalMessage"></h1>

    <p class="final-text">

        Shayad humari mulaqat bahut late hui,
        <br>
        lekin kuch rishte time se nahi,
        <br>
        dil se bante hain. ❤️
        <br><br>

        Happy Raksha Bandhan! 🪢✨

    </p>

</div>


</div>


<!-- ================================================= -->
<!-- MUSIC -->
<!-- ================================================= -->

<audio
    id="song"
    loop
    preload="auto"
>

    <source
        src="rakhi_song.mp3"
        type="audio/mpeg"
    >

</audio>


<script>


/* ================================================= */
/* VARIABLES */
/* ================================================= */

let current = 0;

let selectedSister = "";

const container =
    document.getElementById("container");

const music =
    document.getElementById("song");

const totalSlides =
    document.querySelectorAll(".slide").length;


/* ================================================= */
/* SISTER DATA */
/* ================================================= */

const sisters = {


    /* ================================================= */
    /* SAKSHI */
    /* ================================================= */

    sakshi: {

        name:"Sakshi",

        message:`

        Meri pyari Sakshi ❤️<br><br>

        Happy Raksha Bandhan! 🪢✨<br><br>

        Sach kahu toh agar kisi ne mujhe college ke
        4th year mein ye bola hota ki isi saal mujhe
        do aisi ladkiyan milengi jinhe main apni behen
        maan lunga, toh shayad main believe nahi karta. ❤️<br><br>

        Humari mulaqat ko abhi sirf ek saal hua hai,
        aur technically humara ye rishta bahut purana bhi
        nahi hai. Lekin kab tum meri life mein ek
        sister wali jagah bana gayi, pata hi nahi chala. ❤️<br><br>

        Meri koi real sister nahi hai, isliye shayad
        mujhe kabhi samajh hi nahi aaya tha ki
        brother-sister wala bond kaisa hota hai.
        Lekin tumse milne ke baad laga ki har rishta
        blood relation se hi nahi banta. Kuch rishte
        dil se bhi ban jaate hain. 🥹❤️<br><br>

        Pichhle ek saal mein humne jitna bhi time saath
        spend kiya, jo bhi baatein hui, jo bhi hasi-mazaak
        hua aur jo bhi memories bani — mere liye sab
        genuinely special hain. ✨<br><br>

        Ho sakta hai main har baar express na kar paun,
        lekin I really care about you.
        Aur ab tum sirf meri college friend nahi ho,
        tum meri behen ho. ❤️<br><br>

        Main bas ye chahta hu ki life mein tum hamesha
        khush raho, apne dreams achieve karo aur
        kabhi kisi situation mein khud ko alone mat samajhna.
        Jab bhi zarurat ho, apne bhai ko yaad kar lena.
        Main hamesha tumhare side mein rahunga. 🤝❤️<br><br>

        Shayad humari mulaqat thodi late hui,
        lekin main genuinely thankful hu ki hui.
        Aur I hope ye bond college ke baad bhi
        aise hi bana rahe. ❤️<br><br>

        Happy Raksha Bandhan, Sakshi! 🪢🌸<br><br>

        Thank you for becoming the sister
        I never had. ❤️<br><br>

        Always stay happy and keep smiling. ✨

        `,

        photos:[
            "sakshi1.jpg",
            "sakshi2.jpg",
            "sakshi3.jpeg",
            "sakshi4.png"
        ]

    },


    /* ================================================= */
    /* MITALI */
    /* ================================================= */

    mitali: {

        name:"Mitali",

        message:`

        Meri pyari Mitali ❤️<br><br>

        Happy Raksha Bandhan! 🪢✨<br><br>

        Kabhi kabhi life mein kuch log bahut late
        milte hain, lekin milne ke baad lagta hai ki
        shayad inka milna zaroori tha. Tum bhi mere liye
        unhi logon mein se ho. ❤️<br><br>

        Hum college ke 4th year mein mile aur abhi
        sirf ek saal hi hua hai. Phir bhi pata nahi
        kaise tum meri life mein ek sister wali
        special place bana gayi. 🥹❤️<br><br>

        Meri koi real sister nahi hai, aur honestly
        mujhe kabhi pata hi nahi tha ki sister ke saath
        kaisa bond hota hai. Lekin tumse milne ke baad
        mujhe laga ki behen banne ke liye same family
        mein paida hona zaroori nahi hota.
        Kabhi kabhi dil kisi ko apna bana leta hai. ❤️<br><br>

        Pichhle ek saal mein humari jitni bhi memories
        bani hain, choti ho ya badi, mere liye sab
        important hain. Tumhari presence, tumhari
        baatein aur humara bond — sab kuch special hai. ✨<br><br>

        Main shayad hamesha bol nahi pata,
        but I genuinely care about you.
        Aur aaj Raksha Bandhan par bas itna kehna hai
        ki ab tum meri life mein sirf ek college friend
        nahi ho. Tum meri behen ho. ❤️<br><br>

        Life aage humein kahin bhi le jaaye,
        college khatam ho jaaye, sab apni-apni life
        mein busy ho jaayein, bas main chahta hu ki
        humara ye bond kabhi khatam na ho. ❤️<br><br>

        Tumhare dreams pure ho, tum hamesha khush raho,
        life mein bahut success mile aur jab bhi
        tumhe lage ki kisi apne ki zarurat hai,
        apne bhai ko yaad kar lena. 🤝❤️<br><br>

        Thank you Mitali, meri life mein ek aisi jagah
        banane ke liye jo mere liye genuinely special hai. ❤️<br><br>

        Happy Raksha Bandhan! 🪢🌸<br><br>

        Thank you for becoming the sister
        I never had. ❤️<br><br>

        Hamesha khush rehna aur smile karti rehna. ✨

        `,

        photos:[
            "mitali1.jpg",
            "mitali2.jpg",
            "mitali3.jpg",
            "mitali4.jpg"
        ]

    }

};


/* ================================================= */
/* NEXT SLIDE */
/* ================================================= */

function nextSlide(){

    if(current < totalSlides - 1){

        current++;

        container.style.transform =
            `translate3d(-${current * 100}vw,0,0)`;

    }

}


/* ================================================= */
/* CHECK NAME */
/* ================================================= */

function checkName(){

    const name =
        document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase();


    /* --------------------------------------------- */
    /* SAKSHI */
    /* --------------------------------------------- */

    if(name === "sakshi"){

        selectedSister = "sakshi";

    }


    /* --------------------------------------------- */
    /* MITALI */
    /* --------------------------------------------- */

    else if(name === "mitali"){

        selectedSister = "mitali";

    }


    /* --------------------------------------------- */
    /* WRONG NAME */
    /* --------------------------------------------- */

    else{

        alert(
            "Ye surprise sirf Sakshi aur Mitali ke liye hai ❤️"
        );

        return;

    }


    /* --------------------------------------------- */
    /* GET DATA */
    /* --------------------------------------------- */

    const sister =
        sisters[selectedSister];


    /* --------------------------------------------- */
    /* GREETING */
    /* --------------------------------------------- */

    document
    .getElementById("greeting")
    .innerHTML =
        `Happy Raksha Bandhan ${sister.name} 🪢❤️`;


    /* --------------------------------------------- */
    /* MESSAGE */
    /* --------------------------------------------- */

    document
    .getElementById("message")
    .innerHTML =
        sister.message;


    /* --------------------------------------------- */
    /* PHOTOS */
    /* --------------------------------------------- */

    document
    .getElementById("photo1")
    .src =
        sister.photos[0];

    document
    .getElementById("photo2")
    .src =
        sister.photos[1];

    document
    .getElementById("photo3")
    .src =
        sister.photos[2];

    document
    .getElementById("photo4")
    .src =
        sister.photos[3];


    /* --------------------------------------------- */
    /* FINAL MESSAGE */
    /* --------------------------------------------- */

    document
    .getElementById("finalMessage")
    .innerHTML =
        `Stay Happy ${sister.name} ❤️<br>
         Keep Smiling Always ✨`;


    /* --------------------------------------------- */
    /* MUSIC */
    /* --------------------------------------------- */

    music
    .play()
    .then(() => {

        console.log("Music Started");

    })
    .catch((err) => {

        console.log(
            "Music blocked:",
            err
        );

    });


    /* --------------------------------------------- */
    /* GO TO GREETING */
    /* --------------------------------------------- */

    nextSlide();

}


/* ================================================= */
/* ENTER KEY SUPPORT */
/* ================================================= */

document
.getElementById("username")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        checkName();

    }

});

</script>


</body>

</html>
